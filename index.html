<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سر الأهرامات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* المتغيرات والألوان الأساسية */
        :root {
            --gold: #d4af37;
            --dark-gold: #aa8529;
            --lapis-blue: #0f1c3f;
            --papyrus: #f4ebd8;
            --dark-brown: #3e2723;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #050a15;
            background-image: radial-gradient(circle, #0f1c3f 0%, #050a15 100%);
            font-family: 'Amiri', serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* الشاشة الافتتاحية (الأنيميشن) */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--lapis-blue);
            background-image: 
                linear-gradient(45deg, rgba(212, 175, 55, 0.1) 25%, transparent 25%), 
                linear-gradient(-45deg, rgba(212, 175, 55, 0.1) 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, rgba(212, 175, 55, 0.1) 75%), 
                linear-gradient(-45deg, transparent 75%, rgba(212, 175, 55, 0.1) 75%);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease-out, transform 1s ease-out;
        }

        .splash-title {
            font-family: 'Aref Ruqaa', serif;
            font-size: 5rem;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5), 2px 2px 4px #000;
            animation: pulse-glow 1.5s infinite alternate;
            text-align: center;
        }

        .splash-subtitle {
            font-size: 1.5rem;
            color: var(--papyrus);
            margin-top: 1rem;
            opacity: 0;
            animation: fade-in-up 1s forwards 0.5s;
        }

        .eye-of-horus {
            font-size: 4rem;
            color: var(--gold);
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }

        /* أنيميشن الشاشة الافتتاحية */
        @keyframes pulse-glow {
            from { text-shadow: 0 0 10px rgba(212, 175, 55, 0.5), 2px 2px 4px #000; transform: scale(1); }
            to { text-shadow: 0 0 30px rgba(212, 175, 55, 1), 2px 2px 4px #000; transform: scale(1.05); }
        }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* تصميم الكتاب وتأثير التقليب (3D) */
        .book-wrapper {
            perspective: 1500px;
            width: 90%;
            max-width: 800px;
            height: 80vh;
            max-height: 900px;
            position: relative;
            display: none; /* يظهر بعد الأنيميشن */
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 1s ease-in, transform 1s ease-in;
        }

        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }

        .page {
            position: absolute;
            top: 0;
            right: 0; /* لأننا في نظام RTL */
            width: 100%;
            height: 100%;
            background-color: var(--papyrus);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.1), -5px 5px 15px rgba(0,0,0,0.3);
            border: 2px solid var(--gold);
            border-radius: 5px 15px 15px 5px; /* شكل أطراف الورق */
            transform-origin: right center; /* مفصلة الكتاب على اليمين */
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
            display: flex;
            flex-direction: column;
            backface-visibility: hidden;
            background-image: 
                linear-gradient(to right, rgba(0,0,0,0.1) 0%, transparent 5%),
                url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.05"/></svg>'); /* نسيج بردي */
        }

        /* الوجه الخلفي للصفحة المقلوبة */
        .page-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--papyrus);
            transform: rotateY(180deg);
            backface-visibility: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.1);
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.05"/></svg>');
            border-radius: 15px 5px 5px 15px;
        }

        .page.flipped {
            transform: rotateY(-180deg); /* التقليب لليسار */
        }

        /* تنسيق محتوى الصفحة */
        .page-content {
            padding: 2.5rem;
            height: 100%;
            overflow-y: auto;
            color: var(--dark-brown);
            /* تصميم إطار فرعوني داخلي */
            border: 4px double var(--dark-gold);
            margin: 15px;
            border-radius: 10px;
            position: relative;
        }

        /* شريط التمرير مخصص */
        .page-content::-webkit-scrollbar { width: 6px; }
        .page-content::-webkit-scrollbar-track { background: transparent; }
        .page-content::-webkit-scrollbar-thumb { background: var(--dark-gold); border-radius: 3px; }

        .chapter-title {
            font-family: 'Aref Ruqaa', serif;
            font-size: 2.5rem;
            color: var(--lapis-blue);
            text-align: center;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--dark-gold);
            padding-bottom: 10px;
        }

        .book-text p {
            font-size: 1.25rem;
            line-height: 1.8;
            margin-bottom: 1rem;
            text-align: justify;
        }

        /* الغلاف */
        .cover {
            background-color: var(--lapis-blue);
            color: var(--gold);
            border: 8px solid var(--gold);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-image: 
                radial-gradient(circle at center, rgba(212, 175, 55, 0.2) 0%, transparent 60%);
        }
        
        .cover .chapter-title {
            color: var(--gold);
            font-size: 4rem;
            border: none;
            text-shadow: 2px 2px 5px #000;
        }

        /* أزرار التحكم */
        .controls {
            position: absolute;
            bottom: -50px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            z-index: 100;
        }

        .btn {
            background: linear-gradient(135deg, var(--gold), var(--dark-gold));
            color: var(--lapis-blue);
            border: none;
            padding: 10px 20px;
            font-family: 'Aref Ruqaa', serif;
            font-size: 1.2rem;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .btn:disabled {
            background: #555;
            color: #222;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .page-number {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Aref Ruqaa', serif;
            color: var(--dark-gold);
            font-size: 1.1rem;
        }

        /* زخارف فرعونية بسيطة */
        .ornament {
            text-align: center;
            color: var(--dark-gold);
            font-size: 2rem;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .splash-title { font-size: 3.5rem; }
            .chapter-title { font-size: 2rem; }
            .book-text p { font-size: 1.1rem; }
            .book-wrapper { height: 75vh; }
        }
    </style>
</head>
<body>

    <!-- الشاشة الافتتاحية -->
    <div id="splash-screen">
        <div class="eye-of-horus">𓁹</div>
        <h1 class="splash-title">سر الأهرامات</h1>
        <p class="splash-subtitle">آلة هندسية أم مقبرة؟</p>
    </div>

    <!-- حاوية الكتاب -->
    <div class="book-wrapper" id="book-wrapper">
        <div class="book" id="book">
            <!-- سيتم حقن الصفحات هنا عبر الجافاسكريبت -->
        </div>
        
        <div class="controls">
            <button class="btn" id="prev-btn" onclick="goPrevPage()">الصفحة السابقة</button>
            <button class="btn" id="next-btn" onclick="goNextPage()">الصفحة التالية</button>
        </div>
    </div>

    <script>

        // التقليب للصفحة التالية (لليسار في RTL)
        function goNextPage() {
            if (currentPageIndex < bookData.length - 1) {
                const page = document.getElementById(`page-${currentPageIndex}`);
                page.classList.add('flipped');
                currentPageIndex++;
                updateButtons();
            }
        }

        // العودة للصفحة السابقة (لليمين في RTL)
        function goPrevPage() {
            if (currentPageIndex > 0) {
                currentPageIndex--;
                const page = document.getElementById(`page-${currentPageIndex}`);
                page.classList.remove('flipped');
                updateButtons();
            }
        }

        function updateButtons() {
            document.getElementById('prev-btn').disabled = currentPageIndex === 0;
            document.getElementById('next-btn').disabled = currentPageIndex === bookData.length - 1;
        }

        // تشغيل التطبيق بعد 3 ثوانٍ
        window.onload = () => {
            initBook();
            
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const bookWrapper = document.getElementById('book-wrapper');
                
                // إخفاء الشاشة الافتتاحية
                splash.style.opacity = '0';
                splash.style.transform = 'scale(1.1)';
                
                setTimeout(() => {
                    splash.style.display = 'none';
                    // إظهار الكتاب
                    bookWrapper.style.display = 'block';
                    setTimeout(() => {
                        bookWrapper.style.opacity = '1';
                        bookWrapper.style.transform = 'scale(1)';
                    }, 50);
                }, 1000); // وقت انتظار تلاشي الشاشة
                
            }, 3000); // 3 ثواني للأنيميشن الأول
        };

    </script>
</body>
</html>
