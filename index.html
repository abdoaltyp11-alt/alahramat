    let currentPageIndex = 0;

    const pageIndicator = document.getElementById('page-indicator');

    function createPages() {
      bookElement.innerHTML = '';
      for (let i = bookData.length - 1; i >= 0; i--) {
        const data = bookData[i];
        const page = document.createElement('div');
        page.id = `page-${i}`;
        page.className = data.isCover ? 'page cover' : 'page';
        page.style.zIndex = String(bookData.length - i);

        if (!data.isCover) {
          page.innerHTML = `
            <div class="page-content book-text">
              <h2 class="chapter-title">${data.title}</h2>
              ${data.content}
            </div>
          `;
        }
        bookElement.appendChild(page);
      }
    }

    function updateButtons() {
      const prev = document.getElementById('prev-btn');
      const next = document.getElementById('next-btn');
      prev.disabled = currentPageIndex === 0;
      next.disabled = currentPageIndex === bookData.length - 1;

      if (currentPageIndex === 0) {
        pageIndicator.textContent = 'الغلاف';
        next.innerHTML = '<span class="btn-text">افتح الكتاب</span><i class="fas fa-book-open"></i>';
      } else {
        pageIndicator.textContent = `صفحة ${currentPageIndex} من ${bookData.length - 1}`;
        next.innerHTML = '<span class="btn-text">التالي</span><i class="fas fa-arrow-left"></i>';
      }
    }

    function goNextPage() {
      if (currentPageIndex >= bookData.length - 1) return;
      const page = document.getElementById(`page-${currentPageIndex}`);
      if (page) page.classList.add('flipped');
      currentPageIndex++;
      updateButtons();
      window.scrollTo(0, 0);
    }

    function goPrevPage() {
      if (currentPageIndex <= 0) return;
      currentPageIndex--;
      const page = document.getElementById(`page-${currentPageIndex}`);
      if (page) page.classList.remove('flipped');
      updateButtons();
    }

    // دعم الأسهم على الكيبورد بدون تعطيلها داخل الحقول مستقبلًا
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') goNextPage();
