<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>سر الأهرامات - النسخة المحمية</title>

    <!-- ===== حماية متقدمة ===== -->
    <script>
        // ==================== حماية الكود المتقدمة ====================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.keyCode === 73)) { e.preventDefault();
                return false; }
            if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j' || e.keyCode === 74)) { e.preventDefault();
                return false; }
            if (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.keyCode === 85)) { e.preventDefault(); return false; }
            if (e.ctrlKey && (e.key === 'S' || e.key === 's' || e.keyCode === 83)) { e.preventDefault(); return false; }
            if (e.ctrlKey && (e.key === 'C' || e.key === 'c' || e.keyCode === 67)) {
                const target = e.target;
                if (target.tagName !== 'INPUT' && target.tagName !== 'TEXTAREA' && !target.isContentEditable) {
                    e.preventDefault();
                    return false;
                }
            }
        });

        document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
        document.addEventListener('dragstart', function(e) { e.preventDefault(); return false; });

        (function detectDevTools() {
            const startTime = new Date().getTime();
            window.addEventListener('resize', function() {
                const currentTime = new Date().getTime();
                if (currentTime - startTime > 5000) {
                    const widthDiff = window.outerWidth - window.innerWidth;
                    const heightDiff = window.outerHeight - window.innerHeight;
                    if (widthDiff > 160 || heightDiff > 160) { window.location.reload(); }
                }
            });
        })();

        function preventDebugging() {
            if (window.console) {
                const originalLog = console.log;
                console.log = function() {
                    const args = Array.from(arguments);
                    if (args.some(arg => typeof arg === 'string' && arg.includes('password'))) return;
                    originalLog.apply(console, arguments);
                };
            }
        }
        preventDebugging();

        function obfuscateSensitiveData() {
            document.querySelectorAll('a[data-encoded]').forEach(link => {
                if (link.getAttribute('data-encoded')) {
                    link.href = atob(link.getAttribute('data-encoded'));
                }
            });
        }

        function preventXSS() {
            const originalCreateElement = document.createElement;
            document.createElement = function(tagName) {
                const element = originalCreateElement.call(document, tagName);
                if (tagName.toLowerCase() === 'script') {
                    Object.defineProperty(element, 'src', {
                        set: function(value) {
                            if (!value.startsWith('https://cdn.tailwindcss.com') &&
                                !value.startsWith('https://fonts.googleapis.com') &&
                                !value.startsWith('https://api.open-meteo.com')) {
                                return;
                            }
                            this.setAttribute('src', value);
                        }
                    });
                }
                return element;
            };
        }
        preventXSS();

        function addDigitalWatermark() {
            const watermark = document.createElement('div');
            watermark.id = 'digital-watermark';
            watermark.style.cssText = `
                        position: fixed; bottom: 5px; right: 5px; color: rgba(212, 175, 55, 0.15);
                        font-size: 8px; font-family: monospace; pointer-events: none; z-index: 9999; user-select: none;
                    `;
            watermark.textContent = '© سر الأهرامات | ' + new Date().getFullYear() + ' | جميع الحقوق محفوظة';
            document.body.appendChild(watermark);
        }

        function protectImages() {
            document.querySelectorAll('img').forEach(img => {
                img.addEventListener('contextmenu', e => e.preventDefault());
                img.addEventListener('copy', e => e.preventDefault());
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            obfuscateSensitiveData();
            addDigitalWatermark();
            protectImages();
        });

        // تكوين Tailwind (اختياري)
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        reem: ['Reem Kufi', 'sans-serif'],
                    },
                    colors: {
                        gold: '#d4af37',
                        'gold-light': '#f3e5ab',
                        'gold-dark': '#997a00',
                        'bg-dark': '#07090e',
                        paper: '#f9f4e8',
                    }
                }
            }
        }
    </script>

    <!-- ===== الخطوط والأنماط ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com">
    </script>

    <style>
        /* ===== حماية ===== */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        input,
        textarea,
        [contenteditable="true"] {
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        img {
            -webkit-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }

        ::selection {
            background: rgba(212, 175, 55, 0.3);
            color: #fff;
        }

        /* ===== أنماط التصميم الأساسية ===== */
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #997a00;
            --bg-dark: #07090e;
            --paper: #f9f4e8;
            --text-main: #1a202c;
            --text-muted: #4a5568;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, #151a28 0%, var(--bg-dark) 100%);
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
            color: var(--gold-light);
        }

        #splash-screen {
            position: fixed;
            inset: 0;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 1.5s ease-in-out, visibility 1.5s;
        }

        .splash-bg {
            position: absolute;
            inset: 0;
            background-image: url('https://i.postimg.cc/R0M6C6Sb/Chat-GPT-Image-12-aghsts-2026-04-43-29-m.png');
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            filter: blur(5px);
            animation: pulse-bg 4s infinite alternate;
        }

        .splash-content {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 1.5rem;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        .splash-image-container {
            width: clamp(120px, 30vw, 200px);
            height: clamp(180px, 45vw, 300px);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
            border: 2px solid var(--gold-primary);
            margin-bottom: clamp(1rem, 3vh, 2rem);
            animation: float-splash 3s ease-in-out infinite;
            flex-shrink: 0;
        }

        .splash-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .splash-title {
            font-family: 'Reem Kufi', sans-serif;
            font-size: clamp(2rem, 8vw, 4rem);
            color: var(--gold-primary);
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6), 2px 2px 4px #000;
            margin: 0;
            opacity: 0;
            animation: fade-in-up 1s forwards 0.5s;
            line-height: 1.2;
        }

        .splash-subtitle {
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            color: var(--gold-light);
            margin-top: clamp(0.3rem, 1vh, 0.7rem);
            opacity: 0;
            animation: fade-in-up 1s forwards 1s;
        }

        @keyframes pulse-bg {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.05);
            }
        }
        @keyframes float-splash {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
                box-shadow: 0 15px 50px rgba(212, 175, 55, 0.6);
            }
        }
        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #app-container {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            perspective: 2000px;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            padding: clamp(0.5rem, 2vh, 1.5rem);
            box-sizing: border-box;
        }

        .book-wrapper {
            position: relative;
            width: clamp(300px, 90vw, 650px);
            height: clamp(400px, 80vh, 850px);
            max-height: 90vh;
            box-shadow: 25px 25px 50px rgba(0, 0, 0, 0.8), -10px 0 20px rgba(0, 0, 0, 0.5) inset;
            border-radius: 5px 20px 20px 5px;
            background: var(--bg-dark);
            flex-shrink: 0;
        }

        .page {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background-color: var(--paper);
            border-radius: 5px 15px 15px 5px;
            box-shadow: inset -5px 0 20px rgba(0, 0, 0, 0.1);
            transform-origin: right center;
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1),
                opacity 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .page::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.06"/></svg>');
            pointer-events: none;
            z-index: 1;
        }

        .page::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 40px;
            height: 100%;
            background: linear-gradient(to left, rgba(0, 0, 0, 0.3) 0%, transparent 100%);
            pointer-events: none;
            z-index: 2;
        }

        .page.flipped {
            transform: rotateY(160deg) scale(0.95);
            opacity: 0;
            pointer-events: none;
        }

        .cover {
            background-image: url('https://i.postimg.cc/R0M6C6Sb/Chat-GPT-Image-12-aghsts-2026-04-43-29-m.png');
            background-size: cover;
            background-position: center;
            background-color: var(--bg-dark);
            border: none;
        }
        .cover::before {
            display: none;
        }
        .cover::after {
            background: linear-gradient(to left, rgba(0, 0, 0, 0.6) 0%, transparent 100%);
        }

        .page-content {
            position: relative;
            z-index: 10;
            padding: clamp(1rem, 4vh, 3rem) clamp(1rem, 3vw, 2.5rem);
            height: 100%;
            overflow-y: auto;
            color: var(--text-main);
            border: 2px solid rgba(212, 175, 55, 0.3);
            margin: clamp(0.4rem, 1.5vh, 1rem);
            border-radius: 8px;
            outline: 1px solid rgba(212, 175, 55, 0.6);
            outline-offset: -6px;
            background: rgba(255, 255, 255, 0.4);
            user-select: text;
            -webkit-overflow-scrolling: touch;
        }

        .page-content::-webkit-scrollbar {
            width: 4px;
        }
        .page-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .page-content::-webkit-scrollbar-thumb {
            background: var(--gold-primary);
            border-radius: 10px;
        }

        .chapter-title {
            font-family: 'Reem Kufi', sans-serif;
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            color: var(--gold-dark);
            text-align: center;
            margin-bottom: clamp(0.8rem, 2vh, 1.5rem);
            font-weight: bold;
            position: relative;
            padding-bottom: clamp(0.6rem, 1.5vh, 1rem);
        }

        .chapter-title::after {
            content: '𓋹 𓍹 𓍺 𓋹';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            letter-spacing: 5px;
            color: var(--gold-primary);
        }

        .book-text p {
            font-size: clamp(1rem, 2.2vw, 1.2rem);
            line-height: clamp(1.8, 2.6vh, 2.2);
            margin-bottom: clamp(0.6rem, 1.5vh, 1.2rem);
            text-align: justify;
            font-weight: 600;
        }

        .book-text .highlight {
            color: var(--gold-dark);
            font-weight: 800;
            font-size: clamp(1.1rem, 2.8vw, 1.3rem);
            display: block;
            margin: clamp(0.8rem, 2vh, 1.5rem) 0;
            text-align: center;
            font-family: 'Reem Kufi', sans-serif;
        }

        .book-text ul {
            list-style: disc;
            padding-right: clamp(1rem, 2vw, 1.5rem);
        }
        .book-text ul li {
            margin-bottom: clamp(0.3rem, 0.8vh, 0.5rem);
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            line-height: clamp(1.8, 2.4vh, 2);
        }

        .book-text h3 {
            font-size: clamp(1.2rem, 3vw, 1.5rem);
        }

        .book-text h4 {
            font-size: clamp(1.1rem, 2.6vw, 1.3rem);
        }

        .controls {
            position: absolute;
            bottom: clamp(-55px, -10vh, -70px);
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 clamp(0.3rem, 1vw, 1rem);
            z-index: 100;
            box-sizing: border-box;
            gap: 0.5rem;
        }

        .btn {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-primary);
            border: 1px solid var(--gold-primary);
            padding: clamp(0.5rem, 1.5vh, 0.8rem) clamp(0.8rem, 2vw, 1.5rem);
            font-family: 'Reem Kufi', sans-serif;
            font-size: clamp(0.8rem, 2vw, 1.1rem);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: clamp(0.3rem, 1vw, 0.6rem);
            min-height: 44px;
            touch-action: manipulation;
            white-space: nowrap;
        }

        .btn:hover:not(:disabled) {
            background: var(--gold-primary);
            color: var(--bg-dark);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #555;
            color: #555;
            transform: none !important;
        }

        .btn i {
            font-size: clamp(0.8rem, 1.8vw, 1rem);
        }

        .page-number {
            font-family: 'Reem Kufi', sans-serif;
            color: var(--gold-primary);
            font-size: clamp(0.7rem, 1.8vw, 1.1rem);
            background: rgba(0, 0, 0, 0.5);
            padding: clamp(0.2rem, 0.8vh, 0.4rem) clamp(0.6rem, 1.5vw, 1.2rem);
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            white-space: nowrap;
            text-align: center;
            min-width: clamp(50px, 12vw, 90px);
        }

        /* ===== استعلامات الوسائط للتجاوب المتقدم ===== */

        /* شاشات صغيرة جدًا (هواتف صغيرة) */
        @media (max-width: 400px) {
            .book-wrapper {
                width: 92vw;
                height: 72vh;
            }
            .page-content {
                padding: 0.8rem 0.7rem;
                margin: 0.3rem;
                outline-offset: -4px;
            }
            .controls {
                bottom: -48px;
                gap: 0.3rem;
                padding: 0 0.2rem;
            }
            .btn {
                padding: 0.4rem 0.6rem;
                font-size: 0.7rem;
                min-height: 38px;
                gap: 0.2rem;
            }
            .btn i {
                font-size: 0.7rem;
            }
            .page-number {
                font-size: 0.65rem;
                padding: 0.2rem 0.5rem;
                min-width: 45px;
            }
            .chapter-title {
                font-size: 1.3rem;
            }
            .book-text p {
                font-size: 0.9rem;
                line-height: 1.7;
            }
            .book-text .highlight {
                font-size: 1rem;
            }
            .splash-image-container {
                width: 100px;
                height: 150px;
            }
            .splash-title {
                font-size: 1.8rem;
            }
        }

        /* هواتف متوسطة وكبيرة */
        @media (min-width: 401px) and (max-width: 768px) {
            .book-wrapper {
                width: 92vw;
                height: 75vh;
            }
            .page-content {
                padding: 1.2rem 1.2rem;
            }
            .controls {
                bottom: -60px;
            }
            .btn {
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }
            .chapter-title {
                font-size: 1.6rem;
            }
            .book-text p {
                font-size: 1rem;
            }
        }

        /* أجهزة لوحية */
        @media (min-width: 769px) and (max-width: 1024px) {
            .book-wrapper {
                width: 80vw;
                height: 75vh;
                max-width: 580px;
            }
            .page-content {
                padding: 2rem 1.8rem;
            }
        }

        /* شاشات كبيرة */
        @media (min-width: 1025px) {
            .book-wrapper {
                width: 60vw;
                max-width: 700px;
                height: 80vh;
                max-height: 900px;
            }
            .page-content {
                padding: 2.8rem 2.5rem;
            }
        }

        /* شاشات عريضة جدًا */
        @media (min-width: 1400px) {
            .book-wrapper {
                max-width: 780px;
                height: 75vh;
                max-height: 950px;
            }
            .page-content {
                padding: 3.5rem 3rem;
            }
        }

        /* تحسين للهواتف في الوضع الأفقي */
        @media (max-height: 500px) and (orientation: landscape) {
            .book-wrapper {
                height: 75vh;
                max-height: 90vh;
                width: 70vw;
            }
            .page-content {
                padding: 0.8rem 1rem;
            }
            .controls {
                bottom: -45px;
            }
            .btn {
                padding: 0.3rem 0.8rem;
                font-size: 0.75rem;
                min-height: 34px;
            }
            .chapter-title {
                font-size: 1.2rem;
                margin-bottom: 0.5rem;
            }
            .book-text p {
                font-size: 0.85rem;
                line-height: 1.5;
                margin-bottom: 0.4rem;
            }
            .book-text .highlight {
                font-size: 0.9rem;
                margin: 0.5rem 0;
            }
            .splash-image-container {
                width: 80px;
                height: 120px;
            }
            .splash-title {
                font-size: 1.6rem;
            }
            .splash-subtitle {
                font-size: 0.8rem;
            }
        }

        /* دعم الوضع المظلم في نظام التشغيل (حفاظًا على التصميم) */
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #f5efe6;
                --text-main: #1e1e2a;
            }
            .page-content {
                background: rgba(245, 239, 230, 0.85);
            }
        }
    </style>
</head>

<body>

    <!-- ===== شاشة البداية ===== -->
    <div id="splash-screen">
        <div class="splash-bg"></div>
        <div class="splash-content">
            <div class="splash-image-container">
                <img src="https://i.postimg.cc/R0M6C6Sb/Chat-GPT-Image-12-aghsts-2026-04-43-29-m.png" alt="غلاف الكتاب" class="splash-image" />
            </div>
            <h1 class="splash-title">سر الأهرامات</h1>
            <p class="splash-subtitle">آلة هندسية أم مقبرة؟</p>
        </div>
    </div>

    <!-- ===== تطبيق الكتاب ===== -->
    <div id="app-container">
        <div class="book-wrapper">
            <div id="book">
                <!-- سيتم حقن الصفحات بواسطة JavaScript -->
            </div>

            <div class="controls">
                <button class="btn" id="prev-btn" onclick="goPrevPage()">
                    <i class="fas fa-arrow-right"></i> <span class="btn-text">السابق</span>
                </button>
                <div class="page-number" id="page-indicator">الغلاف</div>
                <button class="btn" id="next-btn" onclick="goNextPage()">
                    <span class="btn-text">التالي</span> <i class="fas fa-arrow-left"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==================== بيانات الكتاب ====================
        const bookData = [{
            isCover: true,
            content: ``
        }, {
            title: "سر الأهرامات",
            content: `
                        <div style="text-align: center; margin-top: clamp(0.5rem, 2vh, 2rem);">
                            <span class="highlight" style="font-size: clamp(1.3rem, 4vw, 2rem); margin-bottom: clamp(0.8rem, 2vh, 2rem);">هل كان الهرم الأكبر مقبرة…<br>أم آلة هندسية للطاقة؟</span>
                            <p style="text-align: center; color: var(--text-muted); font-size: clamp(0.9rem, 2vw, 1.1rem);">تأليف وإعداد: بحث شامل في وظيفة الأهرامات</p>
                        </div>
                    `
        }, {
            title: "مقدمة",
            content: `
                        <p>منذ آلاف السنين يقف الهرم الأكبر في هضبة الجيزة كأنه رسالة تركها أصحابها للعالم، ثم أُغلقت أبوابها واختفت مفاتيحها.</p>

                        <h3 style="text-align: center; color: var(--text-muted); font-family: 'Reem Kufi', sans-serif; margin-bottom: clamp(0.8rem, 2vh, 1.5rem);">الهرم الذي لا يشبه ما نتوقعه من قبر</h3>

            for (let i = bookData.length - 1; i >= 0; i--) {
                const data = bookData[i];
                const pageDiv = document.createElement('div');

                if (data.isCover) {
                    pageDiv.className = `page cover`;
                } else {
                    pageDiv.className = `page`;
                    pageDiv.innerHTML = `
                                <div class="page-content book-text">
                                    <h2 class="chapter-title">${data.title}</h2>

        }

            if (currentPageIndex < bookData.length - 1) {
                const page = document.getElementById(`page-${currentPageIndex}`);
                page.classList.add('flipped');
                currentPageIndex++;
                updateButtons();
            }
        }

        function goPrevPage() {
            if (currentPageIndex > 0) {
                currentPageIndex--;
                const page = document.getElementById(`page-${currentPageIndex}`);
                page.classList.remove('flipped');
                updateButtons();
            }
        }

        function updateButtons() {
            document.getElementById('prev-btn').disabled = currentPageIndex === 0;
            document.getElementById('next-btn').disabled = currentPageIndex === bookData.length - 1;

                pageIndicator.innerText = "الغلاف";
                document.getElementById('next-btn').innerHTML = '<span class="btn-text">افتح الكتاب</span> <i class="fas fa-book-open"></i>';

                document.getElementById('next-btn').innerHTML = '<span class="btn-text">التالي</span> <i class="fas fa-arrow-left"></i>';
            }
        }
